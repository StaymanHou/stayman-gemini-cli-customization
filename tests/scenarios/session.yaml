group: session
scenarios:
  - id: S1
    name: "session:start routes bug fix to task workflow"
    skill: session-start
    args: "Fix the off-by-one error in the pagination component"
    fixtures:
      gemini_md: fixtures/GEMINI.md
    expect:
      transition_id: S1
      contains_any:
        - "/task-plan"
        - "task"
      not_contains:
        - "/feature-spec"
        - "/product-vision"
        - "/incident-report"
    max_retries: 2

  - id: S2
    name: "session:start routes complex feature to feature:spec"
    skill: session-start
    args: >
      Build a real-time collaborative editing system with conflict
      resolution, presence indicators, offline sync, and multi-cursor
      support. Needs new WebSocket infrastructure, CRDT implementation,
      and UI components for presence and cursors.
    fixtures:
      gemini_md: fixtures/GEMINI.md
    expect:
      transition_id: S2
      contains_any:
        - "/feature-spec"
      not_contains:
        - "/task-plan"
        - "/feature-plan"
    max_retries: 2

  - id: S3
    name: "session:start routes simple feature to feature:plan"
    skill: session-start
    args: >
      Add a dark-mode toggle to the settings page. It should persist the
      user'"'"'s choice in localStorage and apply a theme class to the
      document root. Only UI changes — no new endpoints, no data model
      changes, no architectural decisions. Estimated ~150 lines across
      2-3 files.
    fixtures:
      gemini_md: fixtures/GEMINI.md
    # Either S3 (small feature → feature-plan) or S1 (tiny enough to be a
    # task) is defensible. The scenario intends S3; accept S1 as also valid
    # since the boundary between "task" and "small feature" is fuzzy.
    expect:
      transition_id: S3|S1
      contains_any:
        - "/feature-plan"
        - "/task-plan"
      not_contains:
        - "/feature-spec"
        - "/product-vision"
    max_retries: 2

  - id: S4
    name: "session:start routes incident to incident:report"
    skill: session-start
    args: "Production is down! Users getting 500 errors on the main API"
    fixtures:
      gemini_md: fixtures/GEMINI.md
    expect:
      transition_id: S4
      contains_any:
        - "/incident-report"
        - "incident"
      not_contains:
        - "/task-plan"
        - "/feature-spec"
    max_retries: 2

  - id: S5
    name: "session:start routes product initiative to product:vision"
    skill: session-start
    args: >
      I want to build a completely new product — an AI-powered code
      review tool that integrates with GitHub. Need to plan the whole
      thing from vision to architecture to implementation.
    fixtures:
      gemini_md: fixtures/GEMINI.md
    expect:
      transition_id: S5
      contains_any:
        - "/product-vision"
        - "product"
      not_contains:
        - "/feature-spec"
        - "/task-plan"
    max_retries: 2
